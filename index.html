<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffd678'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='6' fill='none' stroke='%238fb7e8' stroke-width='1.5'/%3E%3C/svg%3E" />
    <title>Aurora-like - Sol System</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-name">AURORA<span class="brand-dim">-LIKE</span></span>
          <span class="brand-sub">Trans-Newtonian Prototype</span>
        </div>
        <nav id="view-tabs" class="view-tabs"></nav>
        <div id="time-controls" class="time-controls"></div>
        <div id="empire-bar" class="empire-bar"></div>
      </header>
      <div class="shell">
        <main class="workspace">
          <div id="view-empire" class="view active"></div>
          <div id="view-map" class="view view-map">
            <aside id="system-panel" class="panel panel-left"></aside>
            <section class="map-pane">
              <canvas id="map"></canvas>
              <div id="map-tools" class="map-tools"></div>
              <div class="map-status">
                <div class="map-hint">
                  drag to pan &middot; scroll to zoom &middot; click to select &middot; double-click to
                  enter a subsystem &middot; space to pause
                </div>
                <div id="map-overlay" class="map-overlay"></div>
              </div>
            </section>
            <aside id="detail-panel" class="panel panel-right"></aside>
          </div>
          <div id="view-colonies" class="view"></div>
          <div id="view-research" class="view"></div>
          <div id="view-officers" class="view"></div>
        </main>
        <aside id="triage-rail" class="triage-rail"></aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
